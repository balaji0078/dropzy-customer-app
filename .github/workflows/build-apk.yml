name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=CORE_API=true --dart-define=API_URL=http://16.112.168.63:8080/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dropzy-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
